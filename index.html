<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRO Composite - Cutting Plane App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        h1 { color: #2c3e50; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; }
        .controls { width: 320px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .canvas-area { flex-grow: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); overflow: auto;}
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; font-size: 14px;}
        select, input, button { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;}
        button { background-color: #2980b9; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 20px;}
        button:hover { background-color: #3498db; }
        
        #raw-material-board {
            background-color: #e0e0e0;
            border: 2px solid #7f8c8d;
            position: relative;
            margin-top: 20px;
        }
        
        /* Area potong termasuk margin (warna merah transparan) */
        .cut-area {
            position: absolute;
            background-color: rgba(231, 76, 60, 0.2); 
            border: 1px dashed #c0392b;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Ukuran aktual part lantai (warna biru) */
        .actual-part {
            background-color: #3498db;
            border: 1px solid #2980b9;
            color: white;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
            overflow: hidden;
        }
    </style>
</head>
<body>

    <h1>Aero Composite - Cutting Plane Optimizer</h1>
    <p>Aplikasi web untuk optimasi raw material. (Semua dimensi dalam satuan <strong>mm</strong>)</p>

    <div class="container">
        <!-- Panel Kiri -->
        <div class="controls">
            <h3>Input Produksi</h3>
            <p style="font-size:12px; color:#f39c12; font-weight:bold;" id="status-koneksi">Sinkronisasi dengan Google Sheets...</p>
            
            <label for="raw-material">1. Pilih Raw Material:</label>
            <select id="raw-material" onchange="updateBoardSize()">
                <option value="">-- Memuat data... --</option>
            </select>

            <label for="margin-input">2. Toleransi Potong / Overlap (mm):</label>
            <input type="number" id="margin-input" value="20" min="0">

            <label for="part-select">3. Pilih Cargo Floor (FIN):</label>
            <select id="part-select">
                <option value="">-- Memuat data... --</option>
            </select>

            <button onclick="addPart()">+ Tambahkan ke Daftar</button>
            <button onclick="clearList()" style="background-color: #e74c3c; margin-top: 5px;">Hapus Daftar</button>

            <h4>Daftar Potongan:</h4>
            <ul id="cut-list" style="font-size: 14px;"></ul>

            <button style="background-color: #27ae60; font-size:15px; padding: 12px;" onclick="simulateCutting()">Hitung & Visualisasikan</button>
        </div>

        <!-- Panel Kanan -->
        <div class="canvas-area">
            <h3>Visualisasi Pemotongan (Skala 1mm = 0.25px)</h3>
            <p id="board-info" style="color: #7f8c8d;">Pilih material terlebih dahulu di panel kiri.</p>
            <div id="raw-material-board"></div>
        </div>
    </div>

    <script>
        const sheetId = '1BqKlfuhjFLFMSwNPrH_DFniZmAjCXAip0nLU2RxICvo';
        const urlCargo = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=Data_Cargo`;
        const urlMaterial = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=Data_Material`;

        let partsDatabase = {};
        let materialsDatabase = {};
        let selectedParts = [];
        const scale = 0.25;

        function parseCSV(csvText) {
            const rows = csvText.split('\n');
            return rows.map(row => row.split(',').map(col => col.replace(/(^"|"$)/g, '').trim()));
        }

        async function loadData() {
            try {
                const resMat = await fetch(urlMaterial);
                const csvMat = await resMat.text();
                const matData = parseCSV(csvMat);
                
                const matSelect = document.getElementById("raw-material");
                matSelect.innerHTML = '<option value="">-- Pilih Raw Material --</option>';
                
                for (let i = 1; i < matData.length; i++) {
                    if(matData[i].length < 3) continue;
                    const name = matData[i][0];
                    const length = parseFloat(matData[i][1]); 
                    const width = parseFloat(matData[i][2]);  
                    
                    if(name) {
                        materialsDatabase[name] = { length, width };
                        matSelect.innerHTML += `<option value="${name}">${name} (${length} x ${width} mm)</option>`;
                    }
                }

                const resCargo = await fetch(urlCargo);
                const csvCargo = await resCargo.text();
                const cargoData = parseCSV(csvCargo);
                
                const cargoSelect = document.getElementById("part-select");
                cargoSelect.innerHTML = '<option value="">-- Pilih Part --</option>';
                
                for (let i = 1; i < cargoData.length; i++) {
                    if(cargoData[i].length < 5) continue;
                    const fin = cargoData[i][0]; 
                    const length = parseFloat(cargoData[i][3]); 
                    const width = parseFloat(cargoData[i][4]);  
                    
                    if(fin && !isNaN(length) && !isNaN(width)) {
                        partsDatabase[fin] = { length, width };
                        cargoSelect.innerHTML += `<option value="${fin}">${fin} (${length} x ${width} mm)</option>`;
                    }
                }

                document.getElementById("status-koneksi").innerText = "✅ Tersinkronisasi dengan Database";
                document.getElementById("status-koneksi").style.color = "green";
            } catch (error) {
                console.error("Error loading data:", error);
                document.getElementById("status-koneksi").innerText = "❌ Gagal memuat data dari Sheets.";
                document.getElementById("status-koneksi").style.color = "red";
            }
        }

        function updateBoardSize() {
            const matName = document.getElementById("raw-material").value;
            const board = document.getElementById("raw-material-board");
            const info = document.getElementById("board-info");
            
            if(!matName) {
                board.style.width = "0px";
                board.style.height = "0px";
                info.innerText = "Pilih material terlebih dahulu.";
                return;
            }

            const mat = materialsDatabase[matName];
            board.style.width = (mat.length * scale) + "px";
            board.style.height = (mat.width * scale) + "px";
            info.innerHTML = `<strong>${matName}</strong> (Panjang: ${mat.length} mm x Lebar: ${mat.width} mm)`;
            board.innerHTML = ""; 
        }

        function addPart() {
            const partFin = document.getElementById("part-select").value;
            if (partFin === "") return alert("Pilih part terlebih dahulu!");
            
            selectedParts.push(partFin);
            
            const li = document.createElement("li");
            li.textContent = partFin + " (" + partsDatabase[partFin].length + "x" + partsDatabase[partFin].width + " mm)";
            document.getElementById("cut-list").appendChild(li);
        }

        function clearList() {
            selectedParts = [];
            document.getElementById("cut-list").innerHTML = "";
            document.getElementById("raw-material-board").innerHTML = "";
        }

        function simulateCutting() {
            const matName = document.getElementById("raw-material").value;
            if(!matName) return alert("Pilih raw material dulu!");
            if(selectedParts.length === 0) return alert("Tambahkan minimal 1 part!");

            const margin = parseFloat(document.getElementById("margin-input").value) || 0;
            const board = document.getElementById("raw-material-board");
            board.innerHTML = ""; 
            
            const matLength = materialsDatabase[matName].length;
            const matWidth = materialsDatabase[matName].width;
            
            let currentX = 0;
            let currentY = 0;
            let maxRowHeight = 0;

            selectedParts.forEach(partFin => {
                const part = partsDatabase[partFin];
                
                // Dimensi aktual ditambah overlap (margin)
                const effectiveLength = part.length + margin;
                const effectiveWidth = part.width + margin;
                
                const w = effectiveLength * scale;
                const h = effectiveWidth * scale;
                
                if (currentX + w > (matLength * scale)) {
                    currentX = 0;
                    currentY += maxRowHeight;
                    maxRowHeight = 0;
                }

                if (currentY + h > (matWidth * scale)) {
                    alert(`Peringatan: Material tidak cukup untuk menyusun ${partFin} ke bawah! Sisa part tidak akan tergambar.`);
                    return; 
                }

                // Membuat area potong luar (Merah Transparan)
                const cutArea = document.createElement("div");
                cutArea.className = "cut-area";
                cutArea.style.width = w + "px";
                cutArea.style.height = h + "px";
                cutArea.style.left = currentX + "px";
                cutArea.style.top = currentY + "px";
                
                // Memberikan jarak padding ke dalam sesuai margin (dibagi 2 untuk tiap sisi)
                cutArea.style.padding = ((margin / 2) * scale) + "px";

                // Membuat kotak part aktual di dalamnya (Biru)
                const actualPart = document.createElement("div");
                actualPart.className = "actual-part";
                actualPart.innerHTML = `<strong>${partFin}</strong><br/>${part.length}x${part.width}`;

                cutArea.appendChild(actualPart);
                board.appendChild(cutArea);

                currentX += w;
                if (h > maxRowHeight) maxRowHeight = h;
            });
        }

        window.onload = loadData;
    </script>
</body>
</html>
