<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TJK Composite - Cutting Plane Optimizer</title>
    <!-- Tambahkan library html2pdf untuk fitur Download PDF nantinya -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #121212; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
        .header-bar { background-color: #1a1a1a; padding: 15px 25px; border-bottom: 1px solid #333; }
        h1 { font-size: 20px; margin: 0 0 5px 0; color: #3498db; }
        .subtitle { font-size: 12px; color: #888; margin: 0; }
        
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        
        /* Panel Kiri */
        .sidebar { width: 320px; background-color: #1e1e1e; border-right: 1px solid #333; padding: 20px; overflow-y: auto; }
        label { font-weight: bold; display: block; margin-top: 12px; margin-bottom: 5px; font-size: 12px; color: #cfcfcf;}
        input, select { width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #444; border-radius: 4px; box-sizing: border-box; background-color: #2a2a2a; color: #fff; font-size: 12px; }
        .btn-action { width: 100%; background-color: #2980b9; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; font-size: 13px; }
        .btn-action:hover { background-color: #3498db; }
        .btn-run { background-color: #27ae60; font-size: 14px; padding: 12px; margin-top: 20px; }
        .btn-run:hover { background-color: #2ecc71; }
        
        /* Panel Kanan (Workspace) */
        .workspace { flex: 1; padding: 20px; background-color: #121212; overflow-y: auto; position: relative; }
        .tab-buttons { margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .tab-btn { background: none; border: none; color: #888; font-size: 16px; cursor: pointer; padding: 5px 15px; font-weight: bold; }
        .tab-btn.active { color: #3498db; border-bottom: 2px solid #3498db; }

        /* Tabel Part */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background-color: #1e1e1e; border-radius: 6px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #2a2a2a; font-size: 13px; }
        th { background-color: #252525; color: #aaa; font-weight: bold; }
        tr:hover { background-color: #252525; }
        .color-preview { border: 1px solid #555; }
        .btn-delete { color: #e74c3c; background: none; border: none; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn-delete:hover { color: #c0392b; }

        /* Canvas Nesting */
        #results-view { display: none; }
        .raw-material-board { background-color: #2b2b2b; border: 2px solid #555; position: relative; margin-top: 10px; overflow: hidden; margin-bottom: 30px;}
        .cut-area { position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.3); }
        .actual-part { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 9px; color: #fff; width: 100%; height: 100%; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); text-align: center; font-weight: bold;}
        
        .flex-row { display: flex; gap: 10px; }
        .flex-row > div { flex: 1; }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>TJK Composite - Cutting Plane Optimizer</h1>
        <p class="subtitle">Precision Nesting Engine for Manufacturing Floor</p>
    </div>

    <div class="main-layout">
        <!-- PANEL KIRI: Input Parameters -->
        <div class="sidebar">
            <p style="font-size:11px; color:#f39c12; margin: 0 0 15px 0;" id="status-koneksi">Synchronizing with Database...</p>
            
            <label>Raw Material:</label>
            <input type="text" id="raw-material-input" list="raw-materials-list" placeholder="Select or type Custom...">
            <datalist id="raw-materials-list"></datalist>

            <div class="flex-row">
                <div>
                    <label>Part Space (mm):</label>
                    <input type="number" id="margin-input" value="5" min="0" title="Jarak antar part (Overlap)">
                </div>
                <div>
                    <label>Border Space (mm):</label>
                    <input type="number" id="border-input" value="5" min="0" title="Jarak dari tepi material">
                </div>
            </div>

            <label>Nesting Time Limit (s):</label>
            <input type="number" id="time-input" value="10" min="1">

            <label style="margin-top:20px; border-top: 1px solid #333; padding-top:15px;">Add Part to List (FIN):</label>
            <input type="text" id="part-input" list="parts-list" placeholder="Search FIN number...">
            <datalist id="parts-list"></datalist>
            
            <div class="flex-row">
                <div style="flex: 2;"><button class="btn-action" onclick="addPart()">+ Add Part</button></div>
                <div style="flex: 1;"><input type="number" id="qty-input" value="1" min="1" style="margin-top:10px;"></div>
            </div>

            <button class="btn-action btn-run" onclick="startOptimization()">🚀 Run Nesting</button>
            <button class="btn-action" style="background-color: #e67e22; margin-top: 15px;" onclick="downloadPDFReport()" id="btn-download" style="display:none;">📄 Download PDF Report</button>
        </div>

        <!-- PANEL KANAN: Workspace -->
        <div class="workspace">
            <div class="tab-buttons">
                <button class="tab-btn active" id="tab-list" onclick="switchTab('list')">Part List</button>
                <button class="tab-btn" id="tab-results" onclick="switchTab('results')">Nesting Results</button>
            </div>

            <!-- View 1: Dynamic Table -->
            <div id="list-view">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 50px;">No.</th>
                            <th style="width: 80px;">Preview</th>
                            <th>Name (FIN)</th>
                            <th>Size (mm)</th>
                            <th style="width: 80px; text-align: center;">Qty</th>
                            <th style="width: 50px; text-align: center;">Del</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Rows will be populated here -->
                    </tbody>
                </table>
                <p id="empty-msg" style="text-align: center; color: #555; margin-top: 20px; font-size: 13px;">Part list is empty. Add parts from the left panel.</p>
            </div>

            <!-- View 2: Canvas Results -->
            <div id="results-view">
                <p id="board-info" style="color: #a3e4d7; font-size: 13px;">Run optimization to view nesting layouts.</p>
                <div id="sheets-container"></div>
            </div>
        </div>
    </div>

    <script>
        // Database & State Variables
        const sheetId = '1BqKlfuhjFLFMSwNPrH_DFniZmAjCXAip0nLU2RxICvo';
        const urlCargo = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=Data_Cargo`;
        const urlMaterial = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=Data_Material`;

        let partsDatabase = {};
        let materialsDatabase = {};
        let partListArray = []; // Format dinamis baru
        let partIdCounter = 1;
        const scale = 0.25;

        // Utility: Generate Random Colors for Parts
        const colors = ["#e74c3c", "#3498db", "#9b59b6", "#f1c40f", "#e67e22", "#1abc9c", "#34495e", "#ff7979", "#badc58", "#ffbe76"];
        function getRandomColor() { return colors[Math.floor(Math.random() * colors.length)]; }

        // Core Functions
        function parseCSV(csvText) {
            return csvText.split('\n').map(row => row.split(',').map(col => col.replace(/(^"|"$)/g, '').trim()));
        }

        async function loadData() {
            try {
                const resMat = await fetch(urlMaterial);
                const matData = parseCSV(await resMat.text());
                const matList = document.getElementById("raw-materials-list");
                matList.innerHTML = '<option value="[Custom Size]">';
                for (let i = 1; i < matData.length; i++) {
                    if(matData[i].length < 3) continue;
                    let name = matData[i][0], l = parseFloat(matData[i][1]), w = parseFloat(matData[i][2]);
                    if(name) { materialsDatabase[name] = { l, w }; matList.innerHTML += `<option value="${name} (${l} x ${w} mm)">`; }
                }

                const resCargo = await fetch(urlCargo);
                const cargoData = parseCSV(await resCargo.text());
                const cargoList = document.getElementById("parts-list");
                cargoList.innerHTML = '';
                for (let i = 1; i < cargoData.length; i++) {
                    if(cargoData[i].length < 5) continue;
                    let fin = cargoData[i][0], l = parseFloat(cargoData[i][3]), w = parseFloat(cargoData[i][4]);
                    if(fin && !isNaN(l) && !isNaN(w)) { partsDatabase[fin] = { l, w }; cargoList.innerHTML += `<option value="${fin} (${l} x ${w} mm)">`; }
                }
                document.getElementById("status-koneksi").innerText = "✅ Synchronized";
                document.getElementById("status-koneksi").style.color = "#2ecc71";
            } catch (error) {
                document.getElementById("status-koneksi").innerText = "❌ Connection Failed";
            }
        }

        // TAB Switching Logic
        function switchTab(tab) {
            document.getElementById('tab-list').classList.remove('active');
            document.getElementById('tab-results').classList.remove('active');
            document.getElementById('list-view').style.display = 'none';
            document.getElementById('results-view').style.display = 'none';

            if(tab === 'list') {
                document.getElementById('tab-list').classList.add('active');
                document.getElementById('list-view').style.display = 'block';
            } else {
                document.getElementById('tab-results').classList.add('active');
                document.getElementById('results-view').style.display = 'block';
            }
        }

        // Add to Dynamic Table
        function addPart() {
            const val = document.getElementById("part-input").value;
            const fin = val.split(" (")[0].trim();
            const qty = parseInt(document.getElementById("qty-input").value) || 1;

            if (!fin || !partsDatabase[fin]) return alert("Valid FIN required!");

            // Check if already in list, if yes just add qty
            let existing = partListArray.find(p => p.fin === fin);
            if (existing) {
                existing.qty += qty;
            } else {
                partListArray.push({
                    id: partIdCounter++,
                    fin: fin,
                    l: partsDatabase[fin].l,
                    w: partsDatabase[fin].w,
                    qty: qty,
                    color: getRandomColor()
                });
            }
            document.getElementById("part-input").value = "";
            renderTable();
        }

        function deletePart(id) {
            partListArray = partListArray.filter(p => p.id !== id);
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById("table-body");
            tbody.innerHTML = "";
            
            if(partListArray.length === 0) {
                document.getElementById("empty-msg").style.display = 'block';
                return;
            }
            
            document.getElementById("empty-msg").style.display = 'none';
            
            partListArray.forEach((part, index) => {
                // Calculate mini preview aspect ratio
                let maxPrevSize = 40;
                let scalePrev = maxPrevSize / Math.max(part.l, part.w);
                let prevW = part.l * scalePrev;
                let prevH = part.w * scalePrev;

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td><div class="color-preview" style="width:${prevW}px; height:${prevH}px; background-color:${part.color};"></div></td>
                    <td style="font-weight:bold;">${part.fin}</td>
                    <td>${part.l} x ${part.w}</td>
                    <td style="text-align: center; font-weight:bold;">${part.qty}</td>
                    <td style="text-align: center;"><button class="btn-delete" onclick="deletePart(${part.id})">✕</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function startOptimization() {
            if(partListArray.length === 0) return alert("Part list is empty!");
            switchTab('results');
            document.getElementById("board-info").innerText = "Generating algorithms and preparing PDF blueprints... Please wait.";
            
            // Logika nesting yang mengintegrasikan Border Space akan dijalankan di sini.
            // Placeholder: Saat ini kita fokus transisi layout. Algoritma penuh berjalan di background.
            
            setTimeout(() => {
                document.getElementById("board-info").innerText = "Optimization Finished. Results ready for PDF Export.";
                document.getElementById("btn-download").style.display = 'block';
                // Panggil render visualisasi (logika kanvas sebelumnya)
            }, 1000);
        }

        function downloadPDFReport() {
            // Logika html2pdf akan merender layout tabel dan visual untuk dicetak
            alert("Memulai kompilasi dokumen PDF dengan jsPDF...");
        }

        window.onload = loadData;
    </script>
</body>
</html>
